name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api-qa.wazoo.dev
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run UI regression checks (a11y + quota banners)
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3100/sign-in; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          BASE_URL=http://localhost:3100 npx playwright test e2e/a11y.spec.ts e2e/quota-banner.spec.ts e2e/quota-surfaces.spec.ts
        env:
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3100/callback
          WORKOS_CLIENT_ID: client_preview_placeholder
          WORKOS_API_KEY: sk_test_preview_placeholder
          WORKOS_COOKIE_PASSWORD: preview-cookie-password-at-least-32-bytes

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx @opennextjs/cloudflare build &&
          npx wrangler deploy --config wrangler.preview.jsonc --name "wazoo-console-pr-${{ github.event.pull_request.number }}"
          --var "NEXT_PUBLIC_API_URL:https://api-qa.wazoo.dev"
          --var "NEXT_PUBLIC_WORKOS_REDIRECT_URI:https://wazoo-console-pr-${{ github.event.pull_request.number }}.ethan-r-davidson.workers.dev/callback"
          --var "WORKOS_CLIENT_ID:client_preview_placeholder"
          --var "WORKOS_API_KEY:sk_test_preview_placeholder"
          --var "WORKOS_COOKIE_PASSWORD:preview-cookie-password-at-least-32-bytes"
        env:
          NEXT_PUBLIC_API_URL: https://api-qa.wazoo.dev
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: https://wazoo-console-pr-${{ github.event.pull_request.number }}.ethan-r-davidson.workers.dev/callback
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          worker_name="wazoo-console-pr-${{ github.event.pull_request.number }}"
          response="$(
            curl -sS -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker_name}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          )"

          echo "${response}"

          if echo "${response}" | grep -q '"success":\s*true'; then
            echo "Deleted ${worker_name}."
          elif echo "${response}" | grep -q '10007'; then
            echo "${worker_name} was already deleted or does not exist."
          fi
          exit 0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx @opennextjs/cloudflare build && npx wrangler deploy --env qa
        env:
          NEXT_PUBLIC_API_URL: https://api-qa.wazoo.dev
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: https://console-qa.wazoo.dev/callback
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
          WAZOO_PLATFORM_ADMIN_TOKEN: ${{ secrets.WAZOO_PLATFORM_ADMIN_TOKEN }}

  e2e-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BASE_URL: https://console-qa.wazoo.dev

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx @opennextjs/cloudflare build && npx wrangler deploy --env=""
        env:
          NEXT_PUBLIC_API_URL: https://api.wazoo.dev
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: https://console.wazoo.dev/callback
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
          WAZOO_PLATFORM_ADMIN_TOKEN: ${{ secrets.WAZOO_PLATFORM_ADMIN_TOKEN }}
