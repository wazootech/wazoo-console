name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api-qa.wazoo.dev

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx @opennextjs/cloudflare build &&
          npx wrangler deploy --config wrangler.preview.jsonc --name "wazoo-console-pr-${{ github.event.pull_request.number }}"
          --var "NEXT_PUBLIC_API_URL:https://api-qa.wazoo.dev"
          --var "NEXT_PUBLIC_WORKOS_REDIRECT_URI:https://wazoo-console-pr-${{ github.event.pull_request.number }}.ethan-r-davidson.workers.dev/callback"
          --var "WORKOS_CLIENT_ID:client_preview_placeholder"
          --var "WORKOS_API_KEY:sk_test_preview_placeholder"
          --var "WORKOS_COOKIE_PASSWORD:preview-cookie-password-at-least-32-bytes"
        env:
          NEXT_PUBLIC_API_URL: https://api-qa.wazoo.dev
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: https://wazoo-console-pr-${{ github.event.pull_request.number }}.ethan-r-davidson.workers.dev/callback
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          worker_name="wazoo-console-pr-${{ github.event.pull_request.number }}"
          response="$(
            curl -sS -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker_name}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          )"

          if echo "${response}" | grep -q '"success":true'; then
            echo "Deleted ${worker_name}."
            exit 0
          fi

          if echo "${response}" | grep -q '"code":10007'; then
            echo "${worker_name} was already deleted."
            exit 0
          fi

          echo "${response}"
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx @opennextjs/cloudflare build && npx wrangler deploy --env qa
        env:
          NEXT_PUBLIC_API_URL: https://api-qa.wazoo.dev
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: https://console-qa.wazoo.dev/callback
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx @opennextjs/cloudflare build && npx wrangler deploy --env=""
        env:
          NEXT_PUBLIC_API_URL: https://api.wazoo.dev
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: https://console.wazoo.dev/callback
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  health-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run health:qa
